version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgedesk-prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgedesk
      POSTGRES_USER: forgedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-forgedesk_secure_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgedesk_redis
    restart: unless-stopped
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgedesk-prod_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-forgedesk}
      - DB_USERNAME=${DB_USERNAME:-forgedesk}
      - DB_PASSWORD=${DB_PASSWORD:-forgedesk_secure_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

  nginx:
    image: nginx:alpine
    container_name: forgedesk-prod_nginx
    restart: unless-stopped
    ports:
      - "8040:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - forgedesk_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgedesk-prod_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./laravel:/var/www/html
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-forgedesk}
      - DB_USERNAME=${DB_USERNAME:-forgedesk}
      - DB_PASSWORD=${DB_PASSWORD:-forgedesk_secure_password}
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - forgedesk_network

  # tiger-bridge (owns the TigerStop serial port + Zebra printer socket).
  # Normally this runs natively on the shop-floor PC the TigerStop is wired
  # into (COM3/etc.) — see tiger-bridge/README.md — NOT in this compose
  # stack, since the NAS running this stack has no serial device. This
  # service only exists for the rare case dev/testing happens on a host that
  # does have the device attached; it is not started by default. Bring it up
  # explicitly with `docker compose --profile local-bridge up -d`, and point
  # TIGER_BRIDGE_URL at the shop PC's LAN IP otherwise (the normal case).
  bridge:
    profiles: ["local-bridge"]
    build:
      context: ./tiger-bridge
    ports:
      - "9111:9111"
    environment:
      BRIDGE_PORT: 9111
      SERIAL_PORT: ${SERIAL_PORT:-/dev/ttyUSB0}
      BAUD_RATE: ${BAUD_RATE:-57600}
      PRINTER_HOST: ${PRINTER_HOST:-192.168.1.50}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}"
    restart: unless-stopped

networks:
  forgedesk_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

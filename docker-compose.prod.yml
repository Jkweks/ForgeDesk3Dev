# Production deployment for VPS (Ubuntu + Docker Compose).
#
# Prerequisites on the host:
#   1. Copy .env.prod.example → .env and fill in APP_KEY, DB_PASSWORD, APP_URL
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. In Nginx Proxy Manager: add a Proxy Host for your domain → forward to
#      http://<VPS_PUBLIC_IP>:80  (HTTP — NPM handles SSL termination off-site)
#      Enable "Websockets Support" if needed; no other special settings required.
#
# Credentials are read from a .env file in this directory (Docker Compose
# automatically loads it for ${VAR} substitution and env_file injection).
# Never commit a populated .env to source control.

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-forgedesk}
      POSTGRES_USER: ${DB_USERNAME:-forgedesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port — postgres is internal only.
    # If you need psql access from the host: docker compose exec postgres psql -U forgedesk
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-forgedesk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgedesk_redis
    restart: unless-stopped
    # No host port — redis is internal only
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/jkweks/forgedesk-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgedesk_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Shared volume: entrypoint syncs compiled public assets here for nginx
      - app_public:/var/www/public_shared
      # Persists user-uploaded files across deployments
      - app_storage:/var/www/html/storage/app/public
    env_file: .env
    environment:
      # Service-discovery values — override anything in .env for these
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Production Laravel settings
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_DRIVER: redis
      LOG_CHANNEL: stack
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

  nginx:
    image: nginx:alpine
    container_name: forgedesk_nginx
    restart: unless-stopped
    ports:
      # NPM off-site proxies to this server's public IP — bind on all interfaces.
      # Keep a firewall rule limiting port 80 to your NPM host IP if desired.
      - "80:80"
    volumes:
      # Compiled public assets synced from app container on startup
      - app_public:/var/www/html/public:ro
      # User-uploaded files (storage/app/public)
      - app_storage:/var/www/html/storage/app/public:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - forgedesk_network

  queue:
    image: ghcr.io/jkweks/forgedesk-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forgedesk_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage/app/public
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

networks:
  forgedesk_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  # Compiled JS/CSS/assets from the image, served by nginx
  app_public:
    driver: local
  # User-uploaded files, persisted across deployments
  app_storage:
    driver: local

# Nginx config embedded inline — no host file needed
configs:
  nginx_conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          index index.php index.html;
          charset utf-8;

          location /storage/ {
              alias /var/www/html/storage/app/public/;
          }

          location / {
              try_files $$uri $$uri/ /index.php?$$query_string;
          }

          location = /favicon.ico { access_log off; log_not_found off; }
          location = /robots.txt  { access_log off; log_not_found off; }

          error_page 404 /index.php;

          location ~ \.php$ {
              fastcgi_pass app:9000;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              include fastcgi_params;
              fastcgi_hide_header X-Powered-By;

              fastcgi_read_timeout 600;
              fastcgi_send_timeout 600;
              fastcgi_connect_timeout 600;

              fastcgi_param HTTP_X_FORWARDED_FOR $$http_x_forwarded_for;
              fastcgi_param HTTP_X_FORWARDED_HOST $$http_x_forwarded_host;
              fastcgi_param HTTP_X_FORWARDED_PORT $$http_x_forwarded_port;
              fastcgi_param HTTP_X_FORWARDED_PROTO $$http_x_forwarded_proto;
              fastcgi_param HTTP_X_FORWARDED_PREFIX $$http_x_forwarded_prefix;
              fastcgi_param HTTPS $$https if_not_empty;
          }

          location ~ /\.(?!well-known).* {
              deny all;
          }

          client_max_body_size 50M;
      }

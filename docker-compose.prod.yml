services:
  postgres:
    image: postgres:16-alpine
    container_name: forgedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgedesk
      POSTGRES_USER: forgedesk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgedesk_redis
    restart: unless-stopped
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/jkweks/forgedesk3dev:latest
    container_name: forgedesk_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage/app/public
    environment:
      APP_NAME: ForgeDesk
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: forgedesk
      DB_USERNAME: forgedesk
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      TRUSTED_PROXIES: "*"
      SANCTUM_EXPIRATION: 480
      RUN_MIGRATIONS: "true"
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

  fab_utils:
    image: ghcr.io/jkweks/fab_utils:latest
    container_name: forgedesk_fab_utils
    restart: unless-stopped
    volumes:
      # Shim plan pics/PDFs bind-mounted to the host for easy scp access.
      # Defaults to ./shim_files next to this compose file; override with
      # FAB_UTILS_SHIM_PATH in .env for an absolute path.
      # First run: seed these dirs from the image, e.g.
      #   docker compose -f docker-compose.prod.yml run --rm --no-deps --entrypoint sh fab_utils \
      #     -c 'cp -rn /var/www/html/shimshop/planpic/. /tmp' ...
      # or simply copy your existing planpic/planpdf contents into shim_files/.
      - ${FAB_UTILS_SHIM_PATH:-./shim_files}/planpic:/var/www/html/shimshop/planpic
      - ${FAB_UTILS_SHIM_PATH:-./shim_files}/planpdf:/var/www/html/shimshop/planpdf
    environment:
      DB_HOST: ${FAB_UTILS_DB_HOST}
      DB_PORT: ${FAB_UTILS_DB_PORT:-5439}
      DB_NAME: ${FAB_UTILS_DB_NAME:-shimshop}
      DB_USER: ${FAB_UTILS_DB_USER:-shimshop}
      DB_PASS: ${FAB_UTILS_DB_PASS}
      SHIMSHOP_TOKEN: ${FAB_UTILS_SHIMSHOP_TOKEN}
    networks:
      - forgedesk_network

  nginx:
    image: nginx:alpine
    container_name: forgedesk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage/app/public:ro
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - fab_utils
    networks:
      - forgedesk_network

  queue:
    image: ghcr.io/jkweks/forgedesk3dev:latest
    container_name: forgedesk_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage/app/public
    environment:
      APP_NAME: ForgeDesk
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: forgedesk
      DB_USERNAME: forgedesk
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stack
      RUN_MIGRATIONS: "false"
      SANCTUM_EXPIRATION: 480
      TRUSTED_PROXIES: "*"
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

configs:
  nginx_conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html/public;
          index index.php index.html;
          charset utf-8;

          location /storage/ {
              alias /var/www/html/storage/app/public/;
          }

          location = /utils {
              return 301 /utils/shimshop/;
          }

          location ^~ /utils/ {
              proxy_pass http://fab_utils:80/;
              proxy_redirect http://fab_utils/ http://$$host/utils/;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header X-Forwarded-Host $$host;
              proxy_set_header X-Forwarded-Port $$server_port;
          }

          location / {
              try_files $$uri $$uri/ /index.php?$$query_string;
          }

          location = /favicon.ico { access_log off; log_not_found off; }
          location = /robots.txt  { access_log off; log_not_found off; }

          error_page 404 /index.php;

          location ~ \.php$ {
              fastcgi_pass app:9000;
              fastcgi_param SCRIPT_FILENAME $$realpath_root$$fastcgi_script_name;
              include fastcgi_params;
              fastcgi_hide_header X-Powered-By;
              fastcgi_read_timeout 600;
              fastcgi_send_timeout 600;
              fastcgi_connect_timeout 600;
              fastcgi_param HTTP_X_FORWARDED_FOR $$http_x_forwarded_for;
              fastcgi_param HTTP_X_FORWARDED_HOST $$http_x_forwarded_host;
              fastcgi_param HTTP_X_FORWARDED_PORT $$http_x_forwarded_port;
              fastcgi_param HTTP_X_FORWARDED_PROTO $$http_x_forwarded_proto;
              fastcgi_param HTTPS $$https if_not_empty;
          }

          location ~ /\.(?!well-known).* {
              deny all;
          }

          client_max_body_size 50M;
      }

networks:
  forgedesk_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_public:
    driver: local
  app_storage:
    driver: local

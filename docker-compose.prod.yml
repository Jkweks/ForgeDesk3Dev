version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: forgedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgedesk
      POSTGRES_USER: forgedesk
      POSTGRES_PASSWORD: forgedesk_secure_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgedesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forgedesk_redis
    restart: unless-stopped
    networks:
      - forgedesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/jkweks/forgedesk-web:latest
    container_name: forgedesk_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Shared volume: entrypoint copies compiled public assets here for nginx
      - app_public:/var/www/public_shared
      # Persists user-uploaded files across deployments
      - app_storage:/var/www/html/storage/app/public
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=forgedesk
      - DB_USERNAME=forgedesk
      - DB_PASSWORD=forgedesk_secure_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forgedesk_network

  nginx:
    image: nginx:alpine
    container_name: forgedesk_nginx
    restart: unless-stopped
    ports:
      - "8040:80"
    volumes:
      # Compiled public assets synced from app container on startup
      - app_public:/var/www/html/public:ro
      # User-uploaded files (storage/app/public)
      - app_storage:/var/www/html/storage/app/public:ro
      # Nginx config stays on the server
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - forgedesk_network

  queue:
    image: ghcr.io/jkweks/forgedesk-web:latest
    container_name: forgedesk_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage/app/public
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=forgedesk
      - DB_USERNAME=forgedesk
      - DB_PASSWORD=forgedesk_secure_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_MIGRATIONS=false
    depends_on:
      - postgres
      - redis
    networks:
      - forgedesk_network

networks:
  forgedesk_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  # Compiled JS/CSS/assets from the image, served by nginx
  app_public:
    driver: local
  # User-uploaded files, persisted across deployments
  app_storage:
    driver: local

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeDeskDev — Fab Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0f1113;
  --surface:   #181b1e;
  --surface2:  #20242a;
  --border:    #2a2f38;
  --border2:   #363c48;
  --text:      #e2e6ed;
  --muted:     #697384;
  --accent:    #f0a500;
  --accent2:   #e05c2a;
  --green:     #2db87c;
  --red:       #e0463a;
  --blue:      #3a8fd1;
  --yellow:    #f0c840;
  --font-head: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --radius:    4px;
  --shadow:    0 2px 12px rgba(0,0,0,.45);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea { font-family: var(--font-mono); background: var(--surface2); color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius); padding: 6px 10px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select option { background: var(--surface2); }

/* ── LAYOUT ───────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── TOP BAR ──────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px; height: 52px;
  background: var(--surface); border-bottom: 2px solid var(--accent);
  flex-shrink: 0;
}
#topbar .logo {
  font-family: var(--font-head); font-size: 22px; font-weight: 800;
  letter-spacing: .04em; color: var(--accent);
  display: flex; align-items: center; gap: 8px;
}
#topbar .logo span { color: var(--muted); font-weight: 400; font-size: 14px; letter-spacing: .1em; }
#topbar .spacer { flex: 1; }
.view-tabs { display: flex; gap: 2px; }
.view-tab {
  font-family: var(--font-head); font-size: 15px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 18px; border-radius: var(--radius);
  color: var(--muted); transition: all .15s;
}
.view-tab:hover { color: var(--text); background: var(--surface2); }
.view-tab.active { color: var(--bg); background: var(--accent); }
#user-badge {
  font-family: var(--font-mono); font-size: 12px; color: var(--muted);
  padding: 4px 12px; border: 1px solid var(--border2); border-radius: 20px;
}

/* ── TOOLBAR ──────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#toolbar input[type=search] { width: 220px; }
#toolbar select { min-width: 110px; }
.btn {
  font-family: var(--font-head); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 16px; border-radius: var(--radius); transition: all .15s;
}
.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: #ffb820; }
.btn-ghost { color: var(--muted); border: 1px solid var(--border2); }
.btn-ghost:hover { color: var(--text); border-color: var(--text); }
.btn-danger { color: var(--red); border: 1px solid var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-sm { padding: 3px 10px; font-size: 12px; }
#toolbar .spacer { flex: 1; }

/* ── MAIN CONTENT ─────────────────────────────────────────── */
#main { flex: 1; overflow: hidden; display: flex; }

/* ── WORK ORDER TABLE ─────────────────────────────────────── */
#wo-panel { flex: 1; overflow-y: auto; padding: 0; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 2;
  font-family: var(--font-head); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  background: var(--surface2); color: var(--muted);
  padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border2);
  white-space: nowrap;
}
tbody tr {
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .1s;
}
tbody tr:hover { background: var(--surface2); }
tbody tr.selected { background: rgba(240,165,0,.08); border-left: 3px solid var(--accent); }
tbody td { padding: 9px 12px; vertical-align: middle; }
.td-project { font-weight: 500; max-width: 220px; }
.td-project small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.td-mono { font-family: var(--font-mono); font-size: 12px; }
.badge {
  display: inline-block; font-family: var(--font-head); font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 3px; letter-spacing: .06em;
}
.badge-sf  { background: rgba(58,143,209,.2); color: var(--blue); }
.badge-cw  { background: rgba(224,92,42,.2);  color: var(--accent2); }
.badge-ok  { background: rgba(45,184,124,.15); color: var(--green); }
.badge-sof { background: rgba(240,200,64,.15); color: var(--yellow); }
.badge-no  { background: rgba(224,70,58,.1);   color: var(--red); }

/* date urgency colouring */
.date-ok   { color: var(--green); }
.date-warn { color: var(--yellow); }
.date-late { color: var(--red); font-weight: 600; }

/* stage mini-bar */
.stage-bar { display: flex; gap: 3px; align-items: center; }
.stage-pip {
  width: 10px; height: 10px; border-radius: 2px;
  background: var(--border2);
}
.stage-pip.complete    { background: var(--green); }
.stage-pip.in_progress { background: var(--accent); }
.stage-pip.blocked     { background: var(--red); }

/* hours display */
.hours { font-family: var(--font-mono); font-size: 12px; }
.hours .override { color: var(--accent); }

/* ── DETAIL PANEL ─────────────────────────────────────────── */
#detail-panel {
  width: 420px; flex-shrink: 0;
  background: var(--surface); border-left: 1px solid var(--border2);
  overflow-y: auto; display: none; flex-direction: column;
}
#detail-panel.open { display: flex; }
.dp-header {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 10px;
}
.dp-title { flex: 1; }
.dp-title h2 { font-family: var(--font-head); font-size: 22px; font-weight: 800; line-height: 1.1; }
.dp-title .dp-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
.dp-close { color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; }
.dp-close:hover { color: var(--text); }
.dp-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.dp-section h3 {
  font-family: var(--font-head); font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.dp-field label { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.dp-field .val { font-family: var(--font-mono); font-size: 13px; }
.dp-field input, .dp-field select { width: 100%; font-size: 12px; }
.dp-field textarea { width: 100%; font-size: 12px; resize: vertical; }

/* stages in detail */
.stage-item {
  padding: 8px 10px; border-radius: var(--radius);
  border: 1px solid var(--border2); margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
.stage-item:last-child { margin-bottom: 0; }
.stage-status-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  background: var(--border2);
}
.stage-status-dot.complete    { background: var(--green); }
.stage-status-dot.in_progress { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.stage-status-dot.blocked     { background: var(--red); }
.stage-item .stage-name { flex: 1; font-weight: 500; font-size: 13px; }
.stage-item .stage-assign { font-size: 11px; color: var(--muted); }
.stage-status-btn {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em;
  padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border2);
  color: var(--muted); transition: all .15s;
}
.stage-status-btn:hover { border-color: var(--accent); color: var(--accent); }
.add-stage-row { display: flex; gap: 6px; margin-top: 8px; }
.add-stage-row input { flex: 1; }

/* hours widget */
.hours-widget {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--surface2); border-radius: var(--radius); margin-bottom: 8px;
}
.hours-widget .calc { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.hours-widget .label { font-size: 11px; color: var(--muted); }
.hours-override { display: flex; align-items: center; gap: 8px; }
.hours-override label { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.hours-override input { width: 80px; }

/* ── WORKER VIEW ──────────────────────────────────────────── */
#worker-view { flex: 1; overflow-y: auto; padding: 16px 20px; display: none; }
#worker-view.active { display: block; }
.worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.wo-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 6px; overflow: hidden; transition: border-color .15s, box-shadow .15s;
  cursor: pointer;
}
.wo-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wo-card-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 8px;
}
.wo-card-title { flex: 1; font-family: var(--font-head); font-size: 17px; font-weight: 700; line-height: 1.2; }
.wo-card-meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
.wo-card-body { padding: 10px 14px; }
.wo-card-dates { display: flex; gap: 14px; margin-bottom: 8px; }
.wo-card-date label { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.wo-card-date .dval { font-family: var(--font-mono); font-size: 12px; }
.wo-card-stages { display: flex; flex-wrap: wrap; gap: 4px; }
.stage-chip {
  font-size: 11px; padding: 2px 8px; border-radius: 12px;
  border: 1px solid var(--border2); color: var(--muted);
  display: flex; align-items: center; gap: 4px;
}
.stage-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
.stage-chip.complete::before    { background: var(--green); }
.stage-chip.in_progress::before { background: var(--accent); }
.stage-chip.blocked::before     { background: var(--red); }
.stage-chip.in_progress { border-color: var(--accent); color: var(--accent); }

/* material indicator bar */
.mat-bar { height: 3px; background: var(--border2); }
.mat-bar.arrived    { background: var(--green); }
.mat-bar.sof        { background: var(--yellow); }
.mat-bar.not-arrived { background: var(--red); }

/* ── MODAL ────────────────────────────────────────────────── */
#modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
#modal-backdrop.open { display: flex; }
#modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 6px; width: 620px; max-height: 88vh;
  overflow-y: auto; box-shadow: var(--shadow);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
#modal h2 { font-family: var(--font-head); font-size: 22px; font-weight: 800; padding: 18px 20px 0; }
.modal-body { padding: 16px 20px; }
.modal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.form-field input, .form-field select, .form-field textarea { width: 100%; }
.form-field.full { grid-column: 1 / -1; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

/* ── SCROLLBAR ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── EMPTY / LOADING ──────────────────────────────────────── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: var(--font-mono); }
.empty .ico { font-size: 48px; margin-bottom: 12px; }
.loading-row td { text-align: center; color: var(--muted); font-family: var(--font-mono); padding: 40px; }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="logo">⬡ ForgeDeskDev <span>FAB SCHEDULE</span></div>
    <div class="spacer"></div>
    <div class="view-tabs">
      <button class="view-tab active" onclick="switchView('manager')">Manager</button>
      <button class="view-tab" onclick="switchView('worker')">Shop Floor</button>
    </div>
    <div id="user-badge">Demo Mode</div>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <input type="search" id="search" placeholder="Search project, job #…" oninput="debounceFilter()">
    <select id="filter-type" onchange="applyFilter()">
      <option value="">All Types</option>
      <option value="SF">SF</option>
      <option value="CW">CW</option>
    </select>
    <select id="filter-pm" onchange="applyFilter()">
      <option value="">All PMs</option>
    </select>
    <select id="filter-mat" onchange="applyFilter()">
      <option value="">All Material</option>
      <option value="yes">Material In</option>
      <option value="no">Material Pending</option>
    </select>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="openNewWO()">+ New Work Order</button>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- MANAGER TABLE VIEW -->
    <div id="wo-panel">
      <table id="wo-table">
        <thead>
          <tr>
            <th>Project</th>
            <th>WO#</th>
            <th>Type</th>
            <th>System</th>
            <th>Start</th>
            <th>Due</th>
            <th>Est. Hrs</th>
            <th>Material</th>
            <th>Stages</th>
            <th>PM</th>
          </tr>
        </thead>
        <tbody id="wo-tbody">
          <tr class="loading-row"><td colspan="10">Loading work orders…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- WORKER CARD VIEW -->
    <div id="worker-view">
      <div class="worker-grid" id="worker-grid"></div>
    </div>

    <!-- DETAIL PANEL -->
    <div id="detail-panel">
      <div class="dp-header">
        <div class="dp-title">
          <h2 id="dp-name">—</h2>
          <div class="dp-meta" id="dp-meta"></div>
        </div>
        <button class="dp-close" onclick="closeDetail()">✕</button>
      </div>
      <div id="dp-body"></div>
    </div>
  </div>
</div>

<!-- NEW WO MODAL -->
<div id="modal-backdrop" onclick="closeModal(event)">
  <div id="modal">
    <h2 id="modal-title">New Work Order</h2>
    <div class="modal-body">
      <div class="modal-form-grid" id="modal-form"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWO()">Save Work Order</button>
    </div>
  </div>
</div>

window.addEventListener('DOMContentLoaded', () => {
  loadWOs();
  populatePMFilter();
});

async function loadWOs() {
  // In production: const res = await fetch(`${API}/work_orders.php`); allWOs = (await res.json()).data;
  allWOs = DEMO_WOS;
  applyFilter();
}

function populatePMFilter() {
  const pms = [...new Set(DEMO_WOS.map(w => w.project_manager).filter(Boolean))].sort();
  const sel = document.getElementById('filter-pm');
  pms.forEach(pm => { const o = document.createElement('option'); o.value = pm; o.textContent = pm; sel.appendChild(o); });
}

// ── FILTER ────────────────────────────────────────────────────
let searchTimer;
function debounceFilter() { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilter, 220); }

function applyFilter() {
  const q   = document.getElementById('search').value.toLowerCase();
  const typ = document.getElementById('filter-type').value;
  const pm  = document.getElementById('filter-pm').value;
  const mat = document.getElementById('filter-mat').value;

  filtered = allWOs.filter(w => {
    if (q && !w.project_name.toLowerCase().includes(q) && !String(w.job_number).includes(q)) return false;
    if (typ && w.job_type !== typ) return false;
    if (pm  && w.project_manager !== pm) return false;
    if (mat === 'yes' && !isMatArrived(w)) return false;
    if (mat === 'no'  &&  isMatArrived(w)) return false;
    return true;
  });

  renderTable();
  renderWorkerGrid();
}

function isMatArrived(w) {
  const m = (w.material_arrived || '').toLowerCase();
  return m === 'yes';
}

// ── VIEW SWITCH ───────────────────────────────────────────────
function switchView(v) {
  activeView = v;
  document.querySelectorAll('.view-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&v==='manager')||(i===1&&v==='worker')));
  document.getElementById('wo-panel').style.display    = v === 'manager' ? '' : 'none';
  document.getElementById('worker-view').classList.toggle('active', v === 'worker');
  closeDetail();
}

// ── TABLE RENDER ──────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('wo-tbody');
  if (!filtered.length) { tbody.innerHTML = `<tr class="loading-row"><td colspan="10">No work orders match filter.</td></tr>`; return; }

  tbody.innerHTML = filtered.map(w => {
    const dueClass = dueCssClass(w.planned_complete_date);
    const matBadge = matBadgeHtml(w.material_arrived);
    const stagePips = stagePipsHtml(w);
    const hrs = hoursDisplay(w);
    return `
    <tr data-id="${w.id}" onclick="selectWO(${w.id})" class="${selectedWO?.id===w.id?'selected':''}">
      <td class="td-project">${esc(w.project_name)}<small>Job ${esc(String(w.job_number||'—'))} · WO ${esc(w.wo_number)}</small></td>
      <td class="td-mono">${esc(w.wo_number)}</td>
      <td><span class="badge badge-${(w.job_type||'').toLowerCase()}">${esc(w.job_type||'—')}</span></td>
      <td class="td-mono" style="font-size:11px">${esc(w.system||'—')}</td>
      <td class="td-mono ${dueClass}">${fmtDate(w.planned_start_date)}</td>
      <td class="td-mono ${dueClass}">${fmtDate(w.planned_complete_date)}</td>
      <td class="hours">${hrs}</td>
      <td>${matBadge}</td>
      <td>${stagePips}</td>
      <td class="td-mono" style="font-size:12px">${esc(w.project_manager||'—')}</td>
    </tr>`;
  }).join('');
}

function stagePipsHtml(w) {
  const total = w.stage_count || 0;
  if (!total) return '<span style="color:var(--muted);font-size:11px">—</span>';
  const done = w.stages_done || 0;
  const active = w.stages_active || 0;
  const blocked = w.stages_blocked || 0;
  let html = '<div class="stage-bar">';
  for (let i = 0; i < total; i++) {
    let cls = '';
    if (i < done) cls = 'complete';
    else if (i < done + blocked) cls = 'blocked';
    else if (i < done + blocked + active) cls = 'in_progress';
    html += `<div class="stage-pip ${cls}" title="${done}/${total} complete"></div>`;
  }
  html += `<span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:4px">${done}/${total}</span></div>`;
  return html;
}

function matBadgeHtml(mat) {
  const m = (mat || '').toLowerCase();
  if (m === 'yes') return '<span class="badge badge-ok">Yes</span>';
  if (m === 'sof') return '<span class="badge badge-sof">SOF</span>';
  if (!mat || mat === '' || mat === 'no') return '<span class="badge badge-no">—</span>';
  return `<span class="badge badge-sof" title="${esc(mat)}">${esc(mat.substring(0,8))}</span>`;
}

function hoursDisplay(w) {
  const calc = w.estimated_hours_calc || calcHours(w);
  const ovr  = w.estimated_hours_override;
  if (ovr != null) return `<span class="override" title="Override (calc: ${calc}h)">★ ${ovr}h</span>`;
  return `${calc}h`;
}

function calcHours(w) {
  const j = w.joints || 0, fr = w.dr_fr_units || 0, d = w.doors_units || 0;
  if (w.job_type === 'CW')
    return +(j * RATES.cw_prep + fr * RATES.fab_frames + d * RATES.fab_doors).toFixed(2);
  return +(j * RATES.fab_joints + fr * RATES.fab_frames + d * RATES.fab_doors).toFixed(2);
}

// ── WORKER CARD RENDER ────────────────────────────────────────
function renderWorkerGrid() {
  const grid = document.getElementById('worker-grid');
  if (!filtered.length) { grid.innerHTML = '<div class="empty"><div class="ico">📋</div>No work orders match filter.</div>'; return; }

  grid.innerHTML = filtered.map(w => {
    const matCls = (() => {
      const m = (w.material_arrived||'').toLowerCase();
      if (m==='yes') return 'arrived'; if (m==='sof') return 'sof'; return 'not-arrived';
    })();
    const chips = buildStageChips(w);
    return `
    <div class="wo-card" onclick="selectWO(${w.id})">
      <div class="mat-bar ${matCls}"></div>
      <div class="wo-card-header">
        <div>
          <div class="wo-card-title">${esc(w.project_name)}</div>
          <div class="wo-card-meta">Job ${esc(String(w.job_number||'—'))} · WO ${esc(w.wo_number)} · <span class="badge badge-${(w.job_type||'').toLowerCase()}">${esc(w.job_type||'?')}</span></div>
        </div>
      </div>
      <div class="wo-card-body">
        <div class="wo-card-dates">
          <div class="wo-card-date"><label>Start</label><div class="dval ${dueCssClass(w.planned_start_date)}">${fmtDate(w.planned_start_date)}</div></div>
          <div class="wo-card-date"><label>Due</label><div class="dval ${dueCssClass(w.planned_complete_date)}">${fmtDate(w.planned_complete_date)}</div></div>
          <div class="wo-card-date"><label>Est. Hrs</label><div class="dval">${hoursDisplay(w)}</div></div>
        </div>
        <div class="wo-card-stages">${chips}</div>
      </div>
    </div>`;
  }).join('');
}

function buildStageChips(w) {
  // Use demo stages if available, otherwise generic
  const stages = DEMO_STAGES[w.id];
  if (!stages) {
    const total = w.stage_count || 0;
    if (!total) return '<span style="font-size:11px;color:var(--muted)">No stages defined</span>';
    return `<span class="stage-chip">${w.stages_done||0}/${total} stages</span>`;
  }
  return stages.map(s => `<div class="stage-chip ${s.status}">${esc(s.name)}</div>`).join('');
}

// ── DETAIL PANEL ──────────────────────────────────────────────
async function selectWO(id) {
  selectedWO = allWOs.find(w => w.id === id);
  if (!selectedWO) return;

  // Highlight row
  document.querySelectorAll('#wo-tbody tr').forEach(r => r.classList.toggle('selected', +r.dataset.id === id));

  const stages = DEMO_STAGES[id] || [];
  renderDetailPanel(selectedWO, stages);
  document.getElementById('detail-panel').classList.add('open');

  // In production: load stages from API
  // const res = await fetch(`${API}/stages.php?wo_id=${id}`);
  // const { data: stages } = await res.json();
  // renderDetailPanel(selectedWO, stages);
}

function renderDetailPanel(wo, stages) {
  document.getElementById('dp-name').textContent  = wo.project_name;
  document.getElementById('dp-meta').textContent  = `Job ${wo.job_number||'—'} · WO ${wo.wo_number} · ${wo.job_type||'?'} · ${wo.system||'—'}`;

  const calc = calcHours(wo);
  const ovr  = wo.estimated_hours_override;

  document.getElementById('dp-body').innerHTML = `
    <!-- Hours -->
    <div class="dp-section">
      <h3>Estimated Work Content</h3>
      <div class="hours-widget">
        <div>
          <div class="calc">${ovr != null ? ovr : calc}h</div>
          <div class="label">${ovr != null ? `Override (calc: ${calc}h)` : 'Calculated'}</div>
        </div>
        <div style="flex:1;font-size:11px;color:var(--muted);font-family:var(--font-mono)">
          ${wo.job_type==='CW'?`${wo.joints||0} joints × ${RATES.cw_prep}`:`${wo.joints||0} joints × ${RATES.fab_joints}`} + ${wo.dr_fr_units||0} DR/FR × ${RATES.fab_frames} + ${wo.doors_units||0} doors × ${RATES.fab_doors}
        </div>
      </div>
      <div class="hours-override">
        <label>Override hours:</label>
        <input type="number" id="dp-override" value="${ovr??''}" placeholder="e.g. 48" min="0" step="0.25" oninput="updateOverride(${wo.id}, this.value)">
        ${ovr != null ? `<button class="btn btn-ghost btn-sm" onclick="clearOverride(${wo.id})">Clear</button>` : ''}
      </div>
    </div>

    <!-- Dates -->
    <div class="dp-section">
      <h3>Dates</h3>
      <div class="dp-grid">
        <div class="dp-field"><label>Received</label><div class="val td-mono">${fmtDate(wo.date_received)}</div></div>
        <div class="dp-field"><label>Plan Start</label><div class="val td-mono ${dueCssClass(wo.planned_start_date)}">${fmtDate(wo.planned_start_date)}</div></div>
        <div class="dp-field"><label>Plan Complete</label><div class="val td-mono ${dueCssClass(wo.planned_complete_date)}">${fmtDate(wo.planned_complete_date)}</div></div>
        <div class="dp-field"><label>Requested Finish</label><div class="val td-mono">${fmtDate(wo.requested_finish_date)}</div></div>
      </div>
    </div>

    <!-- Quantities -->
    <div class="dp-section">
      <h3>Quantities</h3>
      <div class="dp-grid">
        <div class="dp-field"><label>Joints</label><div class="val td-mono">${wo.joints??'—'}</div></div>
        <div class="dp-field"><label>DR/FR Units</label><div class="val td-mono">${wo.dr_fr_units??'—'}</div></div>
        <div class="dp-field"><label>Doors Units</label><div class="val td-mono">${wo.doors_units??'—'}</div></div>
        <div class="dp-field"><label>Material</label><div class="val">${matBadgeHtml(wo.material_arrived)}</div></div>
      </div>
    </div>

    <!-- Stages -->
    <div class="dp-section">
      <h3>Stages <span style="font-weight:400;font-size:11px;color:var(--muted)">(${stages.filter(s=>s.status==='complete').length}/${stages.length} done)</span></h3>
      <div id="dp-stages">
        ${stages.length ? stages.map(s => renderStageItem(s)).join('') : '<div style="color:var(--muted);font-size:12px;font-family:var(--font-mono)">No stages yet.</div>'}
      </div>
      <div class="add-stage-row">
        <input type="text" id="new-stage-name" placeholder="Add stage…">
        <button class="btn btn-ghost btn-sm" onclick="addStage(${wo.id})">Add</button>
      </div>
    </div>

    <!-- Notes -->
    <div class="dp-section">
      <h3>Notes</h3>
      <textarea rows="3" style="width:100%">${esc(wo.notes||'')}</textarea>
    </div>

    <!-- Actions -->
    <div class="dp-section" style="display:flex;gap:8px;border-bottom:none">
      <button class="btn btn-primary btn-sm" onclick="editWO(${wo.id})">Edit Work Order</button>
      <button class="btn btn-danger btn-sm" onclick="archiveWO(${wo.id})">Archive</button>
    </div>
  `;
}

function renderStageItem(s) {
  const statusCycle = { pending: 'in_progress', in_progress: 'complete', complete: 'pending', blocked: 'in_progress' };
  const next = statusCycle[s.status] || 'pending';
  return `
  <div class="stage-item" id="stage-${s.id}">
    <div class="stage-status-dot ${s.status}"></div>
    <div class="stage-name">${esc(s.name)}</div>
    <div class="stage-assign">${esc(s.assigned_name||'Unassigned')}</div>
    <button class="stage-status-btn" onclick="cycleStage(${s.id},'${next}',this)">${s.status.replace('_',' ')}</button>
  </div>`;
}

function cycleStage(stageId, nextStatus, btn) {
  // In prod: PATCH to API. For demo, update DOM.
  const item = document.getElementById(`stage-${stageId}`);
  const dot  = item.querySelector('.stage-status-dot');
  dot.className  = `stage-status-dot ${nextStatus}`;
  btn.textContent = nextStatus.replace('_',' ');
  const cycle = { pending:'in_progress', in_progress:'complete', complete:'pending', blocked:'in_progress' };
  btn.onclick = () => cycleStage(stageId, cycle[nextStatus], btn);
  // Also update mini-pips in table row
}

function addStage(woId) {
  const inp  = document.getElementById('new-stage-name');
  const name = inp.value.trim();
  if (!name) return;
  const fakeStage = { id: Date.now(), name, status:'pending', assigned_name:null };
  const container = document.getElementById('dp-stages');
  container.insertAdjacentHTML('beforeend', renderStageItem(fakeStage));
  inp.value = '';
  // In prod: POST to /api/stages.php
}

function updateOverride(woId, val) {
  const wo = allWOs.find(w => w.id === woId);
  if (wo) wo.estimated_hours_override = val === '' ? null : parseFloat(val);
  // In prod: PATCH to /api/work_orders.php?id=woId
}

function clearOverride(woId) {
  updateOverride(woId, '');
  selectWO(woId);
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('#wo-tbody tr').forEach(r => r.classList.remove('selected'));
  selectedWO = null;
}

// ── NEW / EDIT MODAL ──────────────────────────────────────────
function openNewWO() { editingWO = null; buildModal({}); document.getElementById('modal-backdrop').classList.add('open'); }
function editWO(id) { editingWO = allWOs.find(w => w.id === id); buildModal(editingWO||{}); document.getElementById('modal-backdrop').classList.add('open'); }

function buildModal(d) {
  document.getElementById('modal-title').textContent = editingWO ? 'Edit Work Order' : 'New Work Order';
  document.getElementById('modal-form').innerHTML = `
    <div class="form-field full"><label>Project Name *</label><input id="mf-project" value="${esc(d.project_name||'')}"></div>
    <div class="form-field"><label>Job #</label><input id="mf-job" value="${esc(d.job_number||'')}"></div>
    <div class="form-field"><label>WO # *</label><input id="mf-wo" value="${esc(d.wo_number||'')}"></div>
    <div class="form-field"><label>Type</label>
      <select id="mf-type">
        <option value="">—</option>
        <option value="SF" ${d.job_type==='SF'?'selected':''}>SF</option>
        <option value="CW" ${d.job_type==='CW'?'selected':''}>CW</option>
      </select></div>
    <div class="form-field"><label>System</label><input id="mf-system" value="${esc(d.system||'')}"></div>
    <div class="form-field"><label>Date Received</label><input type="date" id="mf-received" value="${d.date_received||''}"></div>
    <div class="form-field"><label>Planned Start</label><input type="date" id="mf-start" value="${d.planned_start_date||''}"></div>
    <div class="form-field"><label>Planned Complete</label><input type="date" id="mf-complete" value="${d.planned_complete_date||''}"></div>
    <div class="form-field"><label>Requested Finish</label><input type="date" id="mf-finish" value="${d.requested_finish_date||''}"></div>
    <div class="form-field"><label>Joints</label><input type="number" id="mf-joints" value="${d.joints??''}"></div>
    <div class="form-field"><label>DR/FR Units</label><input type="number" id="mf-drfr" value="${d.dr_fr_units??''}"></div>
    <div class="form-field"><label>Door Units</label><input type="number" id="mf-doors" value="${d.doors_units??''}"></div>
    <div class="form-field"><label>Material Arrived</label>
      <select id="mf-mat">
        <option value="">—</option>
        <option value="Yes"  ${d.material_arrived==='Yes'?'selected':''}>Yes</option>
        <option value="SOF"  ${d.material_arrived==='SOF'?'selected':''}>SOF</option>
        <option value="No"   ${d.material_arrived==='No'?'selected':''}>No</option>
      </select></div>
    <div class="form-field"><label>Project Manager</label><input id="mf-pm" value="${esc(d.project_manager||'')}"></div>
    <div class="form-field full"><label>Notes</label><textarea id="mf-notes" rows="2">${esc(d.notes||'')}</textarea></div>
  `;
}

function saveWO() {
  const payload = {
    project_name: document.getElementById('mf-project').value.trim(),
    job_number:   document.getElementById('mf-job').value.trim(),
    wo_number:    document.getElementById('mf-wo').value.trim(),
    job_type:     document.getElementById('mf-type').value || null,
    system:       document.getElementById('mf-system').value.trim() || null,
    date_received:         document.getElementById('mf-received').value || null,
    planned_start_date:    document.getElementById('mf-start').value    || null,
    planned_complete_date: document.getElementById('mf-complete').value  || null,
    requested_finish_date: document.getElementById('mf-finish').value   || null,
    joints:       +document.getElementById('mf-joints').value || 0,
    dr_fr_units:  +document.getElementById('mf-drfr').value   || 0,
    doors_units:  +document.getElementById('mf-doors').value  || 0,
    material_arrived: document.getElementById('mf-mat').value || null,
    project_manager:  document.getElementById('mf-pm').value.trim() || null,
    notes:            document.getElementById('mf-notes').value.trim() || null,
  };
  if (!payload.project_name || !payload.wo_number) { alert('Project Name and WO# are required.'); return; }
  payload.effective_hours = calcHours(payload);
  payload.stage_count = 0; payload.stages_done = 0; payload.stages_active = 0; payload.stages_blocked = 0;

  if (editingWO) {
    Object.assign(editingWO, payload);
  } else {
    payload.id = Date.now();
    allWOs.push(payload);
  }
  // In prod: fetch PUT/POST to API, then reload
  closeModal();
  applyFilter();
}

function archiveWO(id) {
  if (!confirm('Archive this work order? It will move to the Archive view.')) return;
  allWOs = allWOs.filter(w => w.id !== id);
  closeDetail();
  applyFilter();
  // In prod: DELETE /api/work_orders.php?id=id
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-backdrop')) return;
  document.getElementById('modal-backdrop').classList.remove('open');
}

// ── UTILS ──────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function dueCssClass(dateStr) {
  if (!dateStr) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const due   = new Date(dateStr + 'T00:00:00');
  const diff  = Math.ceil((due - today) / 86400000);
  if (diff < 0)  return 'date-late';
  if (diff <= 3) return 'date-warn';
  return 'date-ok';
}
